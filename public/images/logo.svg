<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <path id="topText" d="M 25,100 A 75,75 0 0,1 175,100" fill="none"/>
    <path id="bottomText" d="M 25,100 A 75,75 0 0,0 175,100" fill="none"/>
  </defs>

  <!-- Background circle — white -->
  <circle cx="100" cy="100" r="99" fill="#FFFFFF"/>

  <!-- Outer double ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#1A1A1A" stroke-width="3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Cross lines spanning the ring gap -->
  <line x1="100" y1="1" x2="100" y2="20" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="100" y1="180" x2="100" y2="199" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="1" y1="100" x2="20" y2="100" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="180" y1="100" x2="199" y2="100" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- House icon — bold geometric -->
  <path d="M100 44 L68 70 L68 110 L88 110 L88 90 L112 90 L112 110 L132 110 L132 70 Z"
        fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="miter"/>

  <!-- SC letters — bold -->
  <text x="84" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#1A1A1A">S</text>
  <text x="106" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#1A1A1A">C</text>

  <!-- Curved top text: SADDLEWOOD -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="5.5" fill="#1A1A1A" font-weight="400">
    <textPath href="#topText" startOffset="50%" text-anchor="middle">SADDLEWOOD</textPath>
  </text>

  <!-- Curved bottom text: CONTRACTING LLC. -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="3.5" fill="#1A1A1A" font-weight="400">
    <textPath href="#bottomText" startOffset="50%" text-anchor="middle">CONTRACTING LLC.</textPath>
  </text>
</svg>
